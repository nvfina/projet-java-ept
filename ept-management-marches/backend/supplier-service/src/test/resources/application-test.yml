# ============================================================
# Configuration de test - Base H2 en mémoire
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:testdb_supplier;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: false

jwt:
  secret: EPT_Gestion_Marches_Secret_Key_2024_Super_Secure_256bits!!
  expiration: 86400000

logging:
  level:
    com.ept.gestion.supplier: DEBUG
